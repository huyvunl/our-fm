<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our FM</title>
<style>
  :root {
    --bg: #14121a; --card: #1e1b27; --line: #2d2938; --text: #f1eef7; --muted: #9d96ad;
    --accent: #ff6b4a; --accent-text: #1a0e0b; --ok: #4ade80; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.02em; }
  h1 span { color: var(--accent); }
  h2 { margin: 0 0 10px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .banner { border-left: 4px solid var(--accent); padding: 10px 12px; margin-bottom: 16px; background: var(--card); border-radius: 8px; }
  .banner.error { border-color: var(--err); }
  input[type=text], input[type=password], input[type=search] {
    width: 100%; padding: 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 600; padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: var(--accent-text); min-height: 44px;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button.link { background: none; color: var(--muted); padding: 0; min-height: 0; font-weight: 400; text-decoration: underline; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  .now { display: flex; gap: 14px; }
  .cover { width: 96px; height: 96px; border-radius: 8px; background: var(--line); object-fit: cover; flex: none; }
  .row .cover { width: 48px; height: 48px; border-radius: 6px; }
  .info { min-width: 0; flex: 1; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .now .title { font-size: 1.15rem; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 10px 0 4px; }
  .fill { height: 100%; width: 0; background: var(--accent); }
  .times { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
  .now-actions { margin-top: 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 1px 5px; margin-left: 6px; border-radius: 4px; background: var(--muted); color: var(--bg); vertical-align: middle; }
  #toast {
    position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 608px; margin: 0 auto;
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    background: var(--err); color: #1a0505; padding: 12px 14px; border-radius: 10px; font-weight: 600;
  }
  #toast button { background: rgba(0,0,0,0.2); color: inherit; min-height: 36px; padding: 6px 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Our <span>FM</span></h1>
    <div class="muted">
      <span id="who"></span>
      <button type="button" id="change-name" class="link hidden">change name</button>
    </div>
  </header>

  <section id="login-view" class="card hidden">
    <h2>Office passcode</h2>
    <form id="login-form">
      <input type="password" id="passcode" placeholder="Passcode" autocomplete="current-password" aria-label="Passcode" required>
      <button type="submit">Enter</button>
    </form>
  </section>

  <section id="name-view" class="card hidden">
    <h2>Your name</h2>
    <p class="muted">Shown next to the songs you add.</p>
    <form id="name-form">
      <input type="text" id="name-input" placeholder="Display name" maxlength="30" autocomplete="nickname" aria-label="Display name" required>
      <button type="submit">Save</button>
    </form>
  </section>

  <div id="app-view" class="hidden">
    <div id="banner" class="banner hidden" role="status"></div>

    <section class="card" aria-label="Now playing">
      <h2>Now playing</h2>
      <div id="now-empty" class="muted">Nothing playing</div>
      <div id="now" class="hidden">
        <div class="now">
          <img id="now-cover" class="cover" alt="">
          <div class="info">
            <div id="now-title" class="title"></div>
            <div id="now-artist" class="muted"></div>
            <div id="now-by" class="muted"></div>
          </div>
        </div>
        <div class="bar"><div id="fill" class="fill"></div></div>
        <div class="times"><span id="t-elapsed">0:00</span><span id="t-total">0:00</span></div>
        <div class="now-actions"><button type="button" id="skip"></button></div>
      </div>
    </section>

    <section class="card" aria-label="Add a song">
      <h2>Add a song</h2>
      <input type="search" id="q" placeholder="Search for a song" maxlength="100" autocomplete="off" aria-label="Search for a song">
      <div id="slots" class="muted" style="margin-top:8px"></div>
      <ul id="results"></ul>
    </section>

    <section class="card" aria-label="Up next">
      <h2>Up next</h2>
      <ul id="queue"></ul>
    </section>
  </div>
</main>

<div id="toast" class="hidden" role="alert">
  <span id="toast-text"></span>
  <button type="button" id="toast-close" aria-label="Dismiss">Dismiss</button>
</div>

<script src="app.js" defer></script>
</body>
</html>
